name: Build and Release Plugin

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version
        id: get_version
        run: |
          # Extract version from tag (e.g. v1.1.0.1 -> 1.1.0.1 or 1.1.0.1 -> 1.1.0.1)
          TAG_NAME="${GITHUB_REF_NAME}"
          VERSION="${TAG_NAME#v}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Update Litefin.Plugin.csproj Version
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          node -e "
            const fs = require('fs');
            const csprojPath = 'Litefin.Plugin.csproj';
            let content = fs.readFileSync(csprojPath, 'utf8');
            if (content.includes('<Version>')) {
              content = content.replace(/<Version>.*?<\/Version>/g, '<Version>' + '${VERSION}' + '</Version>');
            } else {
              content = content.replace('</PropertyGroup>', '  <Version>' + '${VERSION}' + '</Version>\n  </PropertyGroup>');
            }
            fs.writeFileSync(csprojPath, content);
          "

      - name: Build Plugin
        run: dotnet build -c Release -p:Version=${{ steps.get_version.outputs.version }}

      - name: Package Plugin
        id: package
        run: |
          VERSION="${{ steps.get_version.outputs.version }}"
          ZIP_NAME="Litefin.Plugin_${VERSION}.zip"
          
          # Compress built release files
          cd bin/Release/net9.0
          zip -r "../../../${ZIP_NAME}" *
          cd ../../..
          
          # Compute MD5 checksum (Jellyfin plugins repository expects MD5)
          MD5=$(md5sum "${ZIP_NAME}" | awk '{print $1}')
          
          # Output variables to GitHub Actions state
          echo "zip_name=${ZIP_NAME}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "md5=${MD5}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.zip_name }}
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update manifest.json
        run: |
          VERSION="${{ steps.package.outputs.version }}"
          MD5="${{ steps.package.outputs.md5 }}"
          ZIP_NAME="${{ steps.package.outputs.zip_name }}"
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/${ZIP_NAME}"
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Safely parse and update manifest.json using node
          node -e "
            const fs = require('fs');
            const manifestPath = 'manifest.json';
            let manifest = [];
            
            try {
              if (fs.existsSync(manifestPath)) {
                manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
              }
            } catch (e) {
              console.error('Failed to read or parse manifest.json, initializing empty array', e);
            }

            // Find or create plugin entry
            let pluginEntry = manifest.find(p => p.guid === 'f5c68360-ca47-4648-b47c-3da5f112aa8f');
            if (!pluginEntry) {
              pluginEntry = {
                guid: 'f5c68360-ca47-4648-b47c-3da5f112aa8f',
                name: 'Litefin',
                description: 'Litefin client helper plugin, currently it helps backup and restore Litefin app settings directly to/from your Jellyfin server.',
                overview: 'Synchronizes client settings, layout choices, and color themes.',
                owner: 'MoazSalem',
                category: 'General',
                versions: []
              };
              manifest.push(pluginEntry);
            }

            // Add new version details
            const newVersion = {
              version: '${VERSION}',
              changelog: 'Release ${VERSION}',
              targetAbi: '10.11.0.0',
              sourceUrl: '${DOWNLOAD_URL}',
              checksum: '${MD5}',
              timestamp: '${TIMESTAMP}'
            };

            // Ensure no duplicate version entry is retained
            pluginEntry.versions = pluginEntry.versions.filter(v => v.version !== '${VERSION}');
            pluginEntry.versions.unshift(newVersion); // Prepend latest version

            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + '\n');
          "

      - name: Commit and Push Manifest and Csproj Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add manifest.json Litefin.Plugin.csproj
          git commit -m "chore: release version ${{ steps.get_version.outputs.version }}" || exit 0
          git push origin HEAD:${{ github.event.repository.default_branch }}
